name: Deploy mobile web (Vercel)

# Runs on every push that touches the mobile app, plus manual dispatch
# from the Actions tab. The actual deploy happens on GitHub's runners
# (not in any sandboxed Claude environment), so they CAN reach
# api.vercel.com.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — read from `.vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID  — same source
#
# One-time setup before the first run:
#   cd clients/mobile
#   npx vercel link        # connects this dir to a Vercel project
#   # then copy the org+project ids out of .vercel/project.json into
#   # the repo secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/deploy-mobile.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        # Fail fast with a human-readable error when the repo secrets
        # aren't set. Without this, the Vercel CLI just says
        # "No existing credentials found" which doesn't point at the fix.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ]      && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ]     && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}"
            echo "::error::Add them at: Settings → Secrets and variables → Actions"
            echo "::error::Setup steps: clients/mobile/DEPLOY.md §0"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project metadata
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
